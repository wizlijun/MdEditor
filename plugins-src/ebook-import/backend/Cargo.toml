[package]
name = "notemd-ebook-import"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "notemd-ebook-import"
path = "src/main.rs"

[dependencies]
notemd-plugin-sdk = { path = "../../../notemd-plugin-sdk" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
htmd = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
base64 = "0.22"
pdfium-render = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
