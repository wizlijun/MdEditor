[package]
name = "notemd-roam-import"
version = "1.1.0"
edition = "2021"

[lib]
name = "notemd_roam_import"
path = "src/lib.rs"

[[bin]]
name = "notemd-roam-import"
path = "src/main.rs"

[dependencies]
notemd-plugin-sdk = { path = "../../../notemd-plugin-sdk" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
