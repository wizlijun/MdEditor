[package]
name = "notemd-meetings"
version = "0.1.0"
edition = "2021"

[lib]
name = "notemd_meetings"
path = "src/lib.rs"

[[bin]]
name = "notemd-meetings"
path = "src/main.rs"

[dependencies]
notemd-plugin-sdk = { path = "../../../notemd-plugin-sdk" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1"
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
