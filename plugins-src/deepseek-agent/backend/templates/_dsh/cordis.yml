# DeepSeek Harness 组合配置 —— note.md 专用(notemd.deepseek-agent 下发)
#
# 这份文件是**你的**,不是插件的私产:它住在 vault 里、进 git、可以直接手改。
# 插件只在内容与自己编进二进制的那份不一致时覆盖它;想长期改动就改一份副本,
# 用插件设置 `dsh_config` 指过去,插件从此不再碰它。
#
# 为什么组合配置在 vault 而不在 $DSH_HOME:
#   `$DSH_HOME/profiles/<name>` 是 dsh 自己的地盘,由上游 `dsh plugin` 管辖。
#   插件往那里写文件就等于跟上游的 lockfile/bundle 语义抢方向盘。放在 vault 里
#   则是纯文本、可 diff、随 vault 一起同步 —— 也就是信念 2「文件高于应用」。
#
# 怎么被用到:插件跑 `dsh-acp-demo --config <本文件>`(或在 monorepo checkout 里
# 跑 `pnpm --dir <repo> run demo:acp`)。stdout 被 ACP 的 JSON-RPC 占用,所以这棵
# 树里**不能有任何往 stdout 写字的插件**(没有 stdout logger,没有 HMR)。
#
# 上游参考:deepseek-harness `examples/acp-agent/cordis.yml`。

# 用户设置文档($DSH_HOME/settings.yaml,热重载):那里的 `llm-deepseek:` 段
# 不重启就能盖掉下面这行的配置。
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

# 凭据:活进程环境优先,其次 $DSH_HOME/.credentials.yaml(仅属主可读,热重载)。
# 适配器每次请求时才解析 DEEPSEEK_API_KEY —— 所以这份文件里永远没有明文密钥,
# 可以放心进 git。
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# DeepSeek 适配器。想换模型改这里,或者在任务的 task.json 里写 `model`。
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-pro
        contextWindow: 128000
      - id: deepseek-v4-flash
        contextWindow: 128000

# ── 沙箱:这一段才是真正的权限边界 ────────────────────────────────────────
#
# 任务的 policy.json 里那个 permission_mode 最终落在这里。ACP 的
# session/request_permission 只带一个 toolCallId(没有工具名、没有路径),所以
# 客户端侧不可能按路径判断;能看见文件系统的是沙箱,规矩就立在沙箱上。
#
# workspaceRoot 用 process.cwd():插件把子进程的 cwd 设成任务目录,于是
# workspace-write 模式下可写的正是这次任务自己的目录。
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? 'workspace-write'"
    workspaceRoot: !!js process.cwd()

# 审批闸:`ask` 时每次越界都会经 ACP 问客户端一句,由 policy.json 的
# on_permission_request 应答;danger-full-access 下无所谓问不问,直接 never。
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

# bash 执行器与它的子进程管理。
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 60000

# 文件系统栈跟 bash 走同一套沙箱策略:dsh-fs-sandbox 顶掉 dsh-fs-local 挂在
# ctx.fs 上,按生效模式给 write/edit 设栏杆(read-only 拒写,workspace-write 限
# 在工作区+临时目录,danger-full-access 放行)。read-before-edit 正交叠在上面。
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# `todo_write`:让长任务把自己的步骤记下来。
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# 重复调用同一工具时给一句提示(默认阈值 [3,5,8]),只提醒不拦截。
- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'

# 请求压力计量 + 超阈值后压缩较早的历史。跑长任务要靠它,不然上下文撑爆。
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

# ── ACP 自动化服务端 ──────────────────────────────────────────────────────
#
# agent 主干 + JSONL 持久化 + 协议桥。会话日志留在 persistenceRoot,插件只在运行
# 记录里存一个 sessionId 指针 —— 索引是派生数据,文件才是事实源。
#
# persona 里的 {{cwd}} 由每个 ACP 会话的 session/new 参数填,{{model}} 由 loop 填。
# 具体做什么写在任务目录的 AGENTS.md 里,不写在这儿:这里只放身份与通用行为。
- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
    persistenceRoot: !!js "process.env.NOTEMD_DSH_SESSIONS ?? './.dsh-sessions'"
    persistenceCompression: zstd
    workspaceContext:
      maxBytes: 65536
    persona: |
      你是由 {{model}} 驱动的写作与阅读助手,正在为 note.md 的 vault 工作。当前工作目录是 {{cwd}}。

      你的 bash 与文件工具跑在沙箱里 —— 出现 `[sandbox: file access denied …]` 是策略,不是命令写错了。

      本目录下的 AGENTS.md 是本次任务的约定,按它执行。回答要简短、有事实依据;
      读完原文再下结论,不要用检索结果代替通读。
