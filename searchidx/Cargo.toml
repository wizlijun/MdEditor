[package]
name = "searchidx"
version = "0.1.0"
edition = "2021"
description = "Platform-independent full-text index core for note.md vaults."

[dependencies]
# `hooks` is what makes a query interruptible: `Connection::progress_handler`
# is the only place a running statement can be told to stop, and the LIKE
# fallback spends all of its seconds inside one such statement.
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
jieba-rs = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }
ignore = "0.4"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[dev-dependencies]
tempfile = "3"
