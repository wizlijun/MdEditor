[package]
name = "notemd"
version = "6.818.1"
edition = "2021"

[lib]
# Keep the lib crate name stable: the iOS build links `libmdeditor_lib.a` and
# main.rs / all modules reference `mdeditor_lib::`. Only the binary is renamed.
name = "mdeditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools is automatic in debug builds; do not include for release
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
# `watch` is a cargo feature: without it the watch/unwatch commands are never
# registered and every watcher in the app fails with "Command watch not found"
# — which is why a sidecar note rewritten on disk never refreshed itself.
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["time", "process", "io-util", "macros", "rt-multi-thread", "sync"] }
plugin-protocol = { path = "../plugin-protocol" }
# Platform-independent search core. Everything about *how* the vault is scanned,
# tokenized, stored and ranked lives there so that this crate's Tauri commands,
# the CLI and the watcher are three adapters over one algorithm — see
# docs/2026-08-10-vault-search-index-design.md §2.
searchidx = { path = "../searchidx" }
# The CLI's own no-index fallback scan (`cli::search::fallback_scan`) — the
# searchidx crate carries its own separate copy for the same reason.
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lightningcss = "1.0.0-alpha.66"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tempfile = "3.13"
clap = { version = "4", default-features = false, features = ["std", "help", "error-context", "usage"] }
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
dirs = "5"
# Pulled in transitively by reqwest (via tauri-plugin-http / tauri-plugin-updater).
# rustls 0.23 stopped auto-selecting a crypto provider; we install one explicitly
# at startup (see `lib::run`). Direct dep here so the version we install against
# matches what reqwest links.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# Verify-only (pure Rust, zero-dep) minisign signature checking for the plugin
# installer (子项目③). Signing stays in release scripts via the minisign CLI.
minisign-verify = "0.2"
# semver comparison for the CLI `plugin update` newer-version decision (子项目③
# Task 3). Already in the lock via plugin-protocol / tauri; a direct dep lets
# cli/builtin.rs compare an index version against the installed one.
semver = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
urlencoding = "2"
rand = "0.8"

[target.'cfg(unix)'.dependencies]
# `localtime_r` for the tray's absolute "last synced HH:MM" (see `local_parts`).
# Already compiled in the graph via core-foundation, so this is free.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Local-time conversion for the tray's absolute "last synced HH:MM" — the unix
# build uses `libc::localtime_r` for exactly the same thing (see `local_parts`).
# Already compiled in the graph via tauri, so this costs nothing.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Time"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# Host-side CoreLocation for the `host.location.get` plugin API (pos-log etc.).
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-location = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "ios")'.dependencies]
# iOS ONLY. Desktop git goes through the external `git` CLI (vault_sync/git_ops.rs);
# `git2::` appears nowhere outside src/vault_ios/. Keeping it as a desktop dep
# also dragged in `vendored-openssl`, which on windows-msvc builds OpenSSL from
# source and therefore needs Perl + NASM on PATH — a build blocker for nothing.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2", "vendored-openssl"] }

[dev-dependencies]
tempfile = "3"
# `vault_ios` is `#![cfg(any(target_os = "ios", test))]` — it compiles on the dev
# machine so its logic is unit-testable off-device, and it needs git2. Keeping
# git2 here (rather than as a normal desktop dep) keeps it out of every release
# binary while leaving `cargo test` working on all hosts.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2", "vendored-openssl"] }

[profile.release]
opt-level = "z"       # optimize for size
lto = true            # link-time optimization across crates
codegen-units = 1     # one unit → better whole-program optimization
panic = "abort"       # no unwinding tables
strip = true          # strip debug symbols
incremental = false
